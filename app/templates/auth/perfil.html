{% extends 'base.html' %}
{% block title %}Mi Perfil — SIPE{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <i class="bi bi-person-circle text-primary" style="font-size: 4rem;"></i>
                <h4 class="fw-bold mt-3">{{ session.nombre }} {{ session.apellido }}</h4>
                <span class="badge bg-primary">{{ session.rol|capitalize }}</span>

                <hr>

                <div class="text-start">
                    <p><i class="bi bi-envelope me-2 text-muted"></i>{{ session.email }}</p>
                    {% if session.programa %}
                    <p><i class="bi bi-mortarboard me-2 text-muted"></i>{{ session.programa }}</p>
                    {% endif %}
                </div>

                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger mt-3">
                    <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
